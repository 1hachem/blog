repos:
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.29.0
    hooks:
      - id: commitizen
        stages: [commit-msg]
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: >-
          bash -c 'cd apps/blog && args=(); for file in "$@"; do args+=("../../$file"); done; pnpm exec prettier --write --ignore-unknown "${args[@]}"' --
        language: system
        files: \.(js|mjs|cjs|ts|tsx|jsx|json|jsonc|css|astro|md)$
        pass_filenames: true
