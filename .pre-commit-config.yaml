repos:
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.29.0
    hooks:
      - id: commitizen
        stages: [commit-msg]
  - repo: local
    hooks:
      - id: no-comments
        name: no-comments
        entry: pnpm exec no-comments --staged --fix
        language: system
        files: \.(ts|tsx|astro|css)$
        pass_filenames: false
      - id: no-comments-all
        name: no-comments (whole tree)
        entry: pnpm exec no-comments
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: prettier
        name: prettier
        entry: pnpm exec prettier --write --ignore-unknown
        language: system
        files: \.(js|mjs|cjs|ts|tsx|jsx|json|jsonc|css|astro|md|mdx|html|yaml|yml)$
        pass_filenames: true
