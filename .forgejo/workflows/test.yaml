name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: codeberg-tiny
    container:
      image: nixos/nix
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: nix develop --command pnpm install --frozen-lockfile

      - name: Lint
        run: nix develop --command pnpm lint

      - name: Test
        run: nix develop --command pnpm test
