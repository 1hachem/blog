name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: codeberg-tiny
    container:
      image: nixos/nix
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
    steps:
      - name: Checkout
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
        run: |
          nix-shell -p git --run '
            git init -q .
            git remote add origin "https://token:$FORGEJO_TOKEN@${FORGEJO_SERVER_URL#https://}/$FORGEJO_REPOSITORY"
            git fetch -q --depth 1 origin "$FORGEJO_SHA"
            git checkout -q FETCH_HEAD
          '

      - name: Install dependencies
        run: nix develop --command pnpm install --frozen-lockfile

      - name: Build
        run: nix develop --command pnpm run build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: nix develop --command wrangler pages deploy dist --project-name=blog --branch=main
