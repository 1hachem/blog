packages:
  - 'apps/*'
  - 'packages/*'

# Include common libc variants because auto-detection can be unreliable inside
# the NixOS/Nix CI container.
supportedArchitectures:
  os:
    - current
  cpu:
    - current
  libc:
    - current
    - glibc
    - musl

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
